name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only superseded runs for the same PR share a group. Main runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore Oxce.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Oxce.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Oxce.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Oxce.slnx --configuration Release --no-build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore Oxce.slnx --locked-mode

      - name: Collect coverage
        run: dotnet test Oxce.slnx --no-restore --coverlet --coverlet-output-format cobertura --results-directory artifacts/coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: error
